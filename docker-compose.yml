# MCP gateway in front of bibliofil-mcp, vigilo-mcp, fribo-mcp, tibi-mcp, spond-mcp and
# memory-mcp, reachable
# from the internet through Tailscale Funnel. Copy .env.example to .env and
# fill it in. To leave out a server, remove its service, its volume and its
# entry in UPSTREAMS.
#
#   docker compose up -d
#   docker compose exec gateway /mcp-gateway -print-admin-password
#
# Then open https://<machine>.<tailnet>.ts.net/admin

services:
  gateway:
    image: ghcr.io/olsenius/mcp-gateway:latest
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-mcp-gateway}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
      UPSTREAMS: bibliofil=http://bibliofil:8080,vigilo=http://vigilo:8080,fribo=http://fribo:8080,tibi=http://tibi:8080,spond=http://spond:8080,memory=http://memory:8080
      UPSTREAM_TOKEN_BIBLIOFIL: ${BIBLIOFIL_TOKEN:?Set BIBLIOFIL_TOKEN}
      UPSTREAM_TOKEN_VIGILO: ${VIGILO_TOKEN:?Set VIGILO_TOKEN}
      UPSTREAM_TOKEN_FRIBO: ${FRIBO_TOKEN:?Set FRIBO_TOKEN}
      UPSTREAM_TOKEN_TIBI: ${TIBI_TOKEN:?Set TIBI_TOKEN}
      UPSTREAM_TOKEN_SPOND: ${SPOND_TOKEN:?Set SPOND_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_ALLOWED_USERS: ${OIDC_ALLOWED_USERS:-}
      OIDC_LABEL: ${OIDC_LABEL:-}
    volumes:
      - gateway-data:/data
    networks: [internal]
    # Only for local testing without a tunnel:
    # ports: ["127.0.0.1:8080:8080"]

  bibliofil:
    image: ghcr.io/olsenius/bibliofil-mcp:latest
    restart: unless-stopped
    environment:
      MCP_AUTH_TOKEN: ${BIBLIOFIL_TOKEN:?Set BIBLIOFIL_TOKEN}
      # Optional: set here instead of on the admin page (then locked there).
      BIBLIOFIL_URL: ${BIBLIOFIL_URL:-}
      BIBLIOFIL_USER: ${BIBLIOFIL_USER:-}
      BIBLIOFIL_PIN: ${BIBLIOFIL_PIN:-}
      BIBLIOFIL_PICKUP: ${BIBLIOFIL_PICKUP:-}
      BIBSOK_PICKUP: ${BIBSOK_PICKUP:-}
    volumes:
      - bibliofil-data:/data
    networks: [internal]

  # Vigilo parent API (https://github.com/Olsenius/vigilo-connector). Set the
  # client credentials and log in on the gateway's admin page. Vigilo rotates
  # refresh tokens: only one process may hold an account's token.
  vigilo:
    image: ghcr.io/olsenius/vigilo-connector:latest
    restart: unless-stopped
    environment:
      MCP_AUTH_TOKEN: ${VIGILO_TOKEN:?Set VIGILO_TOKEN}
      MCP_ALLOWED_ORIGINS: ${PUBLIC_URL}
      DATA_DIR: /data
      VIGILO_CONFIG_DIR: /data/vigilo
      OTEL_SERVICE_NAME: vigilo-mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
    volumes:
      - vigilo-data:/data
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  # Fribo cabin road plowing (https://github.com/Olsenius/fribo-mcp).
  fribo:
    image: ghcr.io/olsenius/fribo-mcp:latest
    restart: unless-stopped
    environment:
      MCP_AUTH_TOKEN: ${FRIBO_TOKEN:?Set FRIBO_TOKEN}
      # Optional: set here instead of on the admin page (then locked there).
      FRIBO_EMAIL: ${FRIBO_EMAIL:-}
      FRIBO_PASSWORD: ${FRIBO_PASSWORD:-}
      FRIBO_CABIN_ID: ${FRIBO_CABIN_ID:-}
      MCP_READ_ONLY: ${FRIBO_READ_ONLY:-false}
      OTEL_SERVICE_NAME: fribo-mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
    volumes:
      - fribo-data:/data
    networks: [internal]
    read_only: true
    security_opt: [no-new-privileges:true]

  # Tibi e-books from the Norwegian Library of Talking Books and Braille
  # (https://github.com/Olsenius/tibi-mcp).
  tibi:
    image: ghcr.io/olsenius/tibi-mcp:latest
    restart: unless-stopped
    environment:
      MCP_AUTH_TOKEN: ${TIBI_TOKEN:?Set TIBI_TOKEN}
      # Optional: set here instead of on the admin page (then locked there).
      TIBI_CARD_NUMBER: ${TIBI_CARD_NUMBER:-}
      TIBI_PIN: ${TIBI_PIN:-}
      MCP_READ_ONLY: ${TIBI_READ_ONLY:-}
      OTEL_SERVICE_NAME: tibi-mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
    volumes:
      - tibi-data:/data
    networks: [internal]
    read_only: true
    security_opt: [no-new-privileges:true]

  # Shared agent memory over the Obsidian vault
  # (https://github.com/Olsenius/memory-mcp). It keeps its own clone of the
  # private vault, so it needs a deploy key and a persistent volume. Writes
  # stay off until the vault's enabling change is applied.
  memory:
    image: ghcr.io/olsenius/memory-mcp:latest
    restart: unless-stopped
    environment:
      MCP_AUTH_TOKEN: ${MEMORY_TOKEN:?Set MEMORY_TOKEN}
      MCP_READ_ONLY: ${MEMORY_READ_ONLY:-true}
      MEMORY_GIT_REMOTE: ${MEMORY_GIT_REMOTE:-git@github.com:Olsenius/agent.git}
      MEMORY_GIT_BRANCH: ${MEMORY_GIT_BRANCH:-main}
      MEMORY_SSH_KEY_FILE: /run/secrets/memory_deploy_key
      MEMORY_KNOWN_HOSTS_FILE: /run/secrets/memory_known_hosts
      MEMORY_GITHUB_APP_ID: ${MEMORY_GITHUB_APP_ID:-}
      MEMORY_GITHUB_INSTALLATION_ID: ${MEMORY_GITHUB_INSTALLATION_ID:-}
      MEMORY_GITHUB_APP_KEY_FILE: ${MEMORY_GITHUB_APP_KEY_FILE:-}
      OTEL_SERVICE_NAME: memory-mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
    volumes:
      - memory-data:/data
    secrets: [memory_deploy_key, memory_known_hosts]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  # Spond: the kids' activities, responses and participants
  # (https://github.com/Olsenius/spond-no-match-mcp). It keeps other families'
  # data out of its cache and answers.
  spond:
    image: ghcr.io/olsenius/spond-no-match-mcp:latest
    restart: unless-stopped
    environment:
      MCP_AUTH_TOKEN: ${SPOND_TOKEN:?Set SPOND_TOKEN}
      # Optional: set here instead of on the admin page (then locked there).
      SPOND_USERNAME: ${SPOND_USERNAME:-}
      SPOND_PASSWORD: ${SPOND_PASSWORD:-}
      KIDS_CONFIG: ${SPOND_KIDS_CONFIG:-}
      MCP_READ_ONLY: ${SPOND_READ_ONLY:-}
      OTEL_SERVICE_NAME: spond-mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
    volumes:
      - spond-data:/data
    networks: [internal]
    read_only: true
    security_opt: [no-new-privileges:true]

  # Public HTTPS via Tailscale Funnel. Needs an auth key from
  # https://login.tailscale.com/admin/settings/keys and Funnel enabled
  # for the tailnet. Use the cloudflared service below instead if you
  # prefer Cloudflare Tunnel.
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-mcp}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/funnel.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./funnel.json:/config/funnel.json:ro
    networks: [internal]

  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   networks: [internal]
  #   # In the Cloudflare dashboard, point the public hostname to http://gateway:8080

secrets:
  # The deploy key for the private vault and the pinned GitHub host keys.
  # Host key checking is strict, so the known_hosts file must be real.
  memory_deploy_key:
    file: ${MEMORY_DEPLOY_KEY_PATH:-./secrets/memory_deploy_key}
  memory_known_hosts:
    file: ${MEMORY_KNOWN_HOSTS_PATH:-./secrets/memory_known_hosts}

volumes:
  gateway-data:
  bibliofil-data:
  vigilo-data:
  fribo-data:
  tibi-data:
  memory-data:
  spond-data:
  tailscale-state:

networks:
  internal:
